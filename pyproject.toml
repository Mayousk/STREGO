[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strego"
version = "1.0.0"
description = "Trust-region Bayesian optimization with a bi-objective (mean / integrated variance reduction) global phase"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"



dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "torch>=1.13",
    "gpytorch>=1.11",
    "botorch>=0.10",
    # NSMA solves the global phase's bi-objective problem. It pulls in
    # TensorFlow, which it uses in graph mode.
    "nsma>=1.0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["strego*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
